[pytest]
# Only collect the unittest files at the repository root. The standalone
# smoke_test.py scripts are entry points run by CI and the deploy wrapper,
# not pytest modules, so they are kept out of collection on purpose.
testpaths = test_*.py
python_files = test_*.py
norecursedirs = .git backups data app partner_hub deploy .github fonts
filterwarnings =
    ignore::DeprecationWarning
